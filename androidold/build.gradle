buildscript {
    ext.kotlin_version = '1.9.10'  // Recommended for AGP 8.9+
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.gms:google-services:4.4.0" // only if you use Firebase
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}