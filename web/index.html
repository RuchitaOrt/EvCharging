<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="HyCharge Flutter Web App">

  <!-- iOS meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HyCharge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
   <link rel="icon" type="image/png" href="favicon.ico"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">


  <title>HyCharge</title>
  <link rel="manifest" href="manifest.json">

  <!-- ❌ DO NOT add viewport manually (Flutter manages it) -->

  <!-- Splash styles -->
  <style id="splash-screen-style">
    html, body {
      height: 100%;
      margin: 0;
      background-color: #000000;
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

  <link rel="stylesheet" type="text/css" href="splash/style.css">

  <!-- ✅ GOOGLE MAPS (WEB ONLY) -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDdTSK2ZYsXBQMa-PnFx4BHRfE5RIM0uNs&libraries=places">
  </script>

  <script src="splash/splash.js"></script>
</head>

<body>
  <!-- Splash -->
  <picture id="splash">
    <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x"
            media="(prefers-color-scheme: light)">
    <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x"
            media="(prefers-color-scheme: dark)">
    <img class="center" src="splash/img/light-1x.png" alt="">
  </picture>

  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
